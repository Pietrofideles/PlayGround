<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Horde Zero</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08090a;font-family:Impact,"Arial Black",sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}.grain{position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E")}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:2px 2px 0 #000}#top{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:15px;letter-spacing:3px;color:#d7ddd8}.brand b{display:block;font-size:26px;letter-spacing:1px;color:#f1a62a}.wave{text-align:right}.wave span{display:block;font-family:Arial,sans-serif;font-size:11px;font-weight:900;letter-spacing:3px;color:#bbb}.wave b{font-size:38px;color:#ef3b32}
#bars{position:absolute;left:22px;bottom:22px;width:min(310px,38vw)}.label{font-family:Arial,sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;margin-bottom:5px}.bar{height:14px;background:#151515;border:2px solid #bfc5bd;transform:skew(-12deg);overflow:hidden}.fill{height:100%;width:100%;background:#a9d64b;transition:width .15s}.ammo{position:absolute;right:28px;bottom:20px;text-align:right}.ammo b{font-size:44px}.ammo span{font-family:Arial,sans-serif;font-size:11px;letter-spacing:2px;margin-left:8px;color:#bbb}
#cross{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#eee;box-shadow:0 0 3px #000}#cross:before{left:13px;top:-7px;width:2px;height:42px}#cross:after{top:13px;left:-7px;width:42px;height:2px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,9,10,.56);pointer-events:auto;backdrop-filter:blur(3px)}.card{text-align:center}.card h1{font-size:clamp(52px,11vw,105px);line-height:.82;margin:0;color:#eee;text-shadow:5px 5px 0 #8f1d18}.card h1 em{display:block;color:#ed9d29;font-size:.42em;font-style:normal}.card p{font-family:Arial,sans-serif;font-weight:700;color:#bbb;margin:24px 0}.card button{border:0;background:#ed9d29;color:#111;font:900 18px Impact,sans-serif;letter-spacing:2px;padding:16px 30px;transform:skew(-5deg);cursor:pointer}.hidden{display:none!important}
#damage{position:absolute;inset:0;border:0 solid rgba(190,20,10,.8);transition:border-width .08s}.kills{position:absolute;right:28px;top:100px;text-align:right;font-family:Arial,sans-serif;font-size:12px;font-weight:bold;color:#aaa}.kills b{color:#fff}
#touch{display:none;position:absolute;inset:0}.stick{position:absolute;width:100px;height:100px;border:2px solid rgba(255,255,255,.22);border-radius:50%;bottom:38px;left:30px}.stick i{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);left:28px;top:28px}.fire{position:absolute;width:82px;height:82px;border:2px solid rgba(237,157,41,.7);border-radius:50%;bottom:48px;right:34px;text-align:center;line-height:78px;font-size:38px;color:#ed9d29}@media(pointer:coarse){#touch{display:block}.card p{margin:18px}#cross{display:none}} 
</style></head>
<body>
<canvas id="c"></canvas><div class="grain"></div>
<div id="hud"><div id="top"><div class="brand">NIGHTFALL<b>HORDE ZERO</b></div><div class="wave"><span>SECTOR 7 · ONDA</span><b id="wave">1</b></div></div><div id="cross"></div><div id="bars"><div class="label">VIDA</div><div class="bar"><div id="health" class="fill"></div></div></div><div class="ammo"><b id="ammo">12</b><span>/ <b id="reserve" style="font-size:18px">48</b> · MUNIÇÃO</span></div><div class="kills"><b id="kills">0</b> ZUMBIS ELIMINADOS</div><div id="damage"></div><div id="touch"><div id="stick" class="stick"><i id="knob"></i></div><div id="fire" class="fire">●</div></div><div id="overlay"><div class="card"><h1><em>SOBREVIVA À</em> HORDA</h1><p>WASD · mover &nbsp; MOUSE · mirar &nbsp; CLIQUE · atirar &nbsp; R · recarregar</p><button id="start">INICIAR MISSAO</button></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:W/2,y:H/2,down:false};let game=false,paused=false,health=100,ammo=12,reserve=48,wave=1,kills=0,score=0,reloading=false,last=0,shake=0;
let player={x:0,z:0,a:0};let zombies=[],particles=[],bullets=[],tracer=[];
addEventListener('keydown',e=>{keys[e.key.toLower]=true;if(e.key.toLower==='r')reload()});addEventListener('keyup',e=>keys[e.key.toLower]=false);
canvas.addEventListener('mousemove',e=>{if(game&&!paused){mouse.x=e.clientX;mouse.y=e.clientY;player.a=(mouse.x-W/2)/(W*.7)*.9}});
canvas.addEventListener('mousedown',e=>{mouse.down=true;shoot()});addEventListener('mouseup',()=>mouse.down=false);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function reload(){if(reloading||ammo===12||reserve<=0)return;reloading=true;setTimeout(()=>{let n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;reloading=false;updateHUD()},900)}
function updateHUD(){document.getElementById('health').style.width=health+'%';document.getElementById('ammo').textContent=ammo;document.getElementById('reserve').textContent=reserve;document.getElementById('wave').textContent=wave;document.getElementById('kills').textContent=kills}
function spawnWave(){let n=5+wave*2;for(let i=0;i<n;i++){let ang=Math.random()*Math.PI*2,r=18+Math.random()*12;zombies.push({x:Math.sin(ang)*r,z:18+Math.cos(ang)*r,hp:1+(wave>3&&Math.random()<.25?1:0),speed:.7+Math.random()*(.35+wave*.035),hit:0,phase:Math.random()*6})}}
function shoot(){if(!game||paused||reloading)return;if(ammo<=0){reload();return}ammo--;updateHUD();shake=5;
let spread=(mouse.x-W/2)/(W*.45);let hit=null,best=999;
for(const z of zombies){let dx=z.x-player.x,dz=z.z-player.z;let dist=Math.hypot(dx,dz);if(dz>1){let angAim=Math.atan2(dx,dz)-player.a;let sx=W/2+Math.sin(angAim)*W*.8/(dist*.12);let sy=H*.58-H*.12/(dist*.1);if(Math.abs(sx-mouse.x)<45&&Math.abs(sy-mouse.y)<55&&dist<best){best=dist;hit=z}}}
tracer.push({a:0,x1:W/2+35,y1:H*.68,x2:mouse.x,y2:mouse.y});
if(hit){hit.hp--;for(let i=0;i<7;i++)particles.push({x:hit.x,z:hit.z,y:1.4,vx:(Math.random()-5)*1.5,vy:1+Math.random()*2,vz:(Math.random()-5)*1.5,c:'#7fb125',life:1});if(hit.hp<=0){kills++;reserve=Math.min(96,reserve+1);score+=100;zombies.splice(zombies.indexOf(hit),1)}}
if(ammo===0)setTimeout(reload,250)}
function toScreen(x,z){let rx=x-player.x,rzz=z-player.z;let ca=Math.cos(player.a),sa=Math.sin(player.a);let lx=rx*ca-rzz*sa,lz=rx*sa+rzz*ca;if(lz<.5)return null;let sc=420/lz;return {x:W/2+lx*sc,y:H*.58-H*.14*sc,z:lz,sc}}
function worldRect(p,w,h,color){ctx.fillStyle=color;ctx.fillRect(p.x-w*p.sc/2,p.y-h*p.sc,p.sc*w,p.sc*h)}
function draw(){ctx.clearRect(0,0,W,H);let sx=(Math.random-.5)*shake,sy=(Math.random-.5)*shake;ctx.save();ctx.translate(sx,sy);shake*=.8;
// sky
let g=ctx.createLinearGradient(0,0,0,H*.66);g.addColorStop(0,'#1a2631');g.addColorStop(.65,'#59615d');g.addColorStop(1,'#ad8b5d');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H*.68);ctx.fillStyle='#17191a';ctx.beginPath();ctx.moveTo(0,H*.5);for(let x=0;x<=W;x+=120)ctx.lineTo(x,H*(.36+Math.random()*0));ctx.lineTo(W,H*.68);ctx.lineTo(0,H*.68);ctx.fill();
// ground
g=ctx.createLinearGradient(0,H*.5,0,H);g.addColorStop(0,'#34352d');g.addColorStop(1,'#181916');ctx.fillStyle=g;ctx.fillRect(0,H*.5,W,H*.5);
ctx.strokeStyle='rgba(0,0,0,.14)';ctx.lineWidth=1;for(let i=-12;i<13;i++){let p1=toScreen(i*.15,0),p2=toScreen(i*8,55);if(p1&&p2){ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}}for(let d=2;d<40;d+=3){let p=toScreen(0,d);if(p){ctx.beginPath();ctx.moveTo(0,p.y);ctx.lineTo(W,p.y);ctx.stroke()}}
// road and props
ctx.fillStyle='rgba(20,21,18,.8)';ctx.beginPath();ctx.moveTo(W*.42,H*.5);ctx.lineTo(W*.58,H*.5);ctx.lineTo(W*.66,H);ctx.lineTo(W*.34,H);ctx.fill();
for(let side of [-1,1]){for(let d=5;d<35;d+=7){let p=toScreen(side*7,d);if(p){ctx.fillStyle='#20221f';ctx.fillRect(p.x-p.sc*1.2,p.y-p.sc*3,p.sc*2.4,p.sc*3);ctx.fillStyle='#8b3029';ctx.fillRect(p.x-p.sc*.95,p.y-p.sc*2.8,p.sc*1.9,p.sc*1.1)}}}
// zombies sorted far to near
let sorted=[...zombies].sort((a,b)=>Math.hypot(b.x-player.x,b.z-player.z)-Math.hypot(a.x-player.x,a.z-player.z));for(const z of sorted){let p=toScreen(z.x,z.z);if(!p)continue;let s=p.sc*1.35;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#202019';ctx.beginPath();ctx.ellipse(0,0,s*.65,s*.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=z.hit>0?'#d7dabb':'#778c38';ctx.fillRect(-s*.28,-s*1.55,s*.56,s*.62);ctx.fillStyle='#9da090';ctx.beginPath();ctx.arc(0,-s*1.72,s*.24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#151515';ctx.fillRect(-s*.1,-s*1.78,s*.05,s*.05);ctx.fillRect(s*.05,-s*1.78,s*.05,s*.05);ctx.fillStyle='#31332a';ctx.fillRect(-s*.48,-s*1.3,s*.18,s*.95);ctx.fillRect(s*.3,-s*1.3,s*.18,s*.95);ctx.fillStyle='#171711';ctx.fillRect(-s*.22,-s*.95,s*.18,s*.95);ctx.fillRect(s*.04,-s*.95,s*.18,s*.95);ctx.restore();z.hit=Math.max(0,z.hit-.04)}
// weapon
let bob=Math.sin(performance.now()/120)*3;ctx.fillStyle='#17191a';ctx.beginPath();ctx.moveTo(W*.38,H*.75+bob);ctx.lineTo(W*.46,H*.58+bob);ctx.lineTo(W*.56,H*.58+bob);ctx.lineTo(W*.68,H*.88+bob);ctx.closePath();ctx.fill();ctx.fillStyle='#303433';ctx.fillRect(W*.47,H*.66+bob,W*.09,H*.24);ctx.fillStyle='#111';ctx.fillRect(W*.49,H*.57+bob,W*.03,H*.12);ctx.fillStyle='#222';ctx.fillRect(W*.43,H*.72+bob,W*.15,H*.09);
// tracer
ctx.fillStyle='#f6d58a';for(let i=tracer.length-1;i>=0;i--){let t=tracer[i];ctx.globalAlpha=1-t.a*.08;ctx.fillRect(t.x1+(t.x2-t.x1)*.35,t.y1+(t.y2-t.y1)*.35,5,5);t.a++;if(t.a>10)tracer.splice(i,1)}ctx.globalAlpha=1;
ctx.restore();
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;if(game&&!paused){let sp=4*dt;if(keys.w)player.z+=sp;if(keys.s)player.z-=sp;if(keys.a)player.x-=sp;if(keys.d)player.x+=sp;player.x=Math.max(-6,Math.min(6,player.x));player.z=Math.max(-2,Math.min(3,player.z));if(mouse.down)shoot();for(const z of zombies){let dx=player.x-z.x,dz=player.z-z.z,dist=Math.hypot(dx,dz);if(dist>1){z.x+=dx/dist*z.speed*dt;z.z+=dz/dist*z.speed*dt}else{health-=12*dt;document.getElementById('damage').style.borderWidth=(18*Math.random())+'px';if(health<=0){health=0;game=false;document.querySelector('.card h1').innerHTML='<em>SUA MISSÃO ACABOU</em> VOCÊ CAIU';document.querySelector('.card p').textContent=wave+' ONDA · '+kills+' ZUMBIS';document.getElementById('start').textContent='TENTAR NOVAMENTE';document.getElementById('overlay').classList.remove('hidden')}}}if(zombies.length===0){wave++;reserve=Math.min(96,reserve+24);spawnWave()}updateHUD()}draw();requestAnimationFrame(loop)}
function startGame(){health=100;ammo=12;reserve=48;wave=1;kills=0;zombies=[];particles=[];player={x:0,z:0,a:0};spawnWave();updateHUD();game=true;paused=false;document.getElementById('overlay').classList.add('hidden')}
document.getElementById('start').onclick=startGame;
startGame();game=false;document.getElementById('overlay').classList.remove('hidden');document.querySelector('.card h1').innerHTML='<em>SOBREVIVA À</em> HORDA';document.querySelector('.card p').textContent='WASD · mover  |  MOUSE · mirar  |  CLIQUE · atirar  |  R · recarregar';requestAnimationFrame(loop);
// mobile controls
let move={x:0,y:0},stick=document.getElementById('stick'),knob=document.getElementById('knob'),active=false,tid=-1;
stick.addEventListener('pointerdown',e=>{active=true;tid=e.pointerId});stick.addEventListener('pointermove',e=>{if(!active)return;let r=stick.getBoundingClopndRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(32,Math.hypot(dx,dy));let a=Math.atan2(dy,dx);knob.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`;move.x=Math.cos(a)*(m/32);move.y=Math.sin(a)*(m/32)});addEventListener('pointerup',()=>{active=false;move={x:0,y:0};knob.style.transform=''});
setInterval(()=>{if(game&&!paused){if(move.y<-.2)player.z+=.09;if(move.y>.2)player.z-=.09;if(move.x<-.2)player.x-=.09;if(move.x>.2)player.x+=.09}},30);let fd=false;document.getElementById('fire').addEventListener('pointerdown',()=>{fd=true;shoot()});document.getElementById('fire').addEventListener('pointerup',()=>fd=false);canvas.addEventListener('touchstart',e=>{if(e.touches.length){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;player.a=(mouse.x-W/2)/(W*.7)*.9}},{passive:true});
</script>
</body></html>

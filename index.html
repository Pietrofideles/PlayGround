<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Dominion — Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a12;color:#edf3ff;font-family:Impact,'Arial Black',system-ui,sans-serif;user-select:none}button{font:inherit;color:inherit}
#game{position:relative;width:100vw;height:100vh;background:#090d18}canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}.pointer{pointer-events:auto}
.hud{position:absolute;top:18px;left:3%;right:3%;display:flex;justify-content:space-between;align-items:flex-start}
.nameplate{width:38%;filter:drop-shadow(0 5px 12px #000)}.nameplate.right{text-align:right}.name{font-size:clamp(16px,2vw,28px);letter-spacing:2px;text-transform:uppercase;text-shadow:2px 2px #000}.style{font:700 10px Arial;color:#9ba8be;letter-spacing:2px;margin-top:3px}
.bar{height:18px;margin-top:7px;border:3px solid #edf3ff;background:#1a2335;transform:skewX(-12deg);overflow:hidden}.right .bar{transform:skewX(12deg)}.fill{height:100%;background:linear-gradient(90deg,#ff4757,#ffb12b);transition:width .12s}.right .fill{margin-left:auto;background:linear-gradient(90deg,#ffb12b,#ff4757)}
.timer{text-align:center;width:80px;height:80px;border:3px solid #dbe8ff;border-radius:50%;display:grid;place-items:center;font-size:42px;background:#111827cc;box-shadow:0 0 25px #6a6cff66}
#round{position:absolute;top:112px;width:100%;text-align:center;font-size:38px;letter-spacing:8px;text-shadow:3px 3px #000;opacity:0;transition:.25s}
#select{position:absolute;inset:0;background:linear-gradient(135deg,#090d18f2,#15102af2);z-index:5;display:flex;flex-direction:column;padding:22px 5vw}.topline{display:flex;justify-content:space-between;align-items:center}.topline h1{margin:0;font-size:clamp(28px,5vw,64px);letter-spacing:5px}.topline h1 em{color:#ff4d73;font-style:normal}.topline small{font:700 12px Arial;color:#8390a8;letter-spacing:3px}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:18px 0;overflow:auto}.portrait{height:64px;border:2px solid #30384c;background:var(--c);position:relative;cursor:pointer;overflow:hidden;transition:.12s}.portrait:hover,.portrait.selected{transform:translateY(-4px);border-color:#fff;box-shadow:0 0 18px var(--c)}.portrait i{position:absolute;width:22%;height:70%;left:39%;bottom:-8%;border-radius:50% 50% 20% 20%;background:var(--skin)}.portrait i:before{content:"";position:absolute;width:130%;height:38%;left:-15%;top:-18%;border-radius:50%;background:var(--hair)}
#selectionFooter{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}.fighterInfo{max-width:55%}.fighterInfo h2{font-size:clamp(24px,4vw,48px;margin:0);text-transform:uppercase}.fighterInfo p{font:700 12px Arial;color:#aab4ca;margin:5px}.tags span{display:inline-block;border:1px solid #566179;padding:5px 8px;margin-right:5px;font:700 10px Arial;letter-spacing:1px}.begin{border:0;background:#ff416c;color:white;padding:16px 28px;font-size:20px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);box-shadow:0 10px 30px #ff416c55}
#touch{display:none;position:absolute;left:12px;right:12px;bottom:12px;justify-content:space-between;z-index:3}.controls{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:4px}.controls button,#actions button{border:1px solid #ffffff55;background:#10182ca8;border-radius:50%;font-size:17px;touch-action:none}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1}.controls button:nth-child(3){grid-column:3}.controls button:nth-child(4){grid-column:2}#actions{display:grid;grid-template-columns:repeat(2,58px);gap:7px}.action{height:58px!important}
@media(max-width:800px),(pointer:coarse){#grid{grid-template-columns:repeat(6,1fr)}.portrait{height:52px}#touch{display:flex}.hud{top:8px}.timer{width:58px;height:58px;font-size:30px}.nameplate{width:41%}.bar{height:14px}#select{padding:12px 3vw}.topline small{display:none}}
</style></head>
<body><div id="game"><canvas id="c"></canvas><div id="ui"><div class="hud"><div class="nameplate"><div class="name" id="p1name">RYO</div><div class="style" id="p1style">ARTES MARCIAIS</div><div class="bar"><div id="p1hp" class="fill" style="width:100%"></div></div></div><div class="timer" id="timer">60</div><div class="nameplate right"><div class="name" id="p2name">NOVA</div><div class="style" id="p2style">NINJA ELÉTRICO</div><div class="bar"><div id="p2hp" class="fill" style="width:100%"></div></div></div></div><div id="round">ROUND 1</div></div><div id="touch"><div class="controls"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button><button data-key="ArrowDown">▼</button></div><div id="actions"><button class="action" data-key="KeyJ">P</button><button class="action" data-key="KeyK">K</button></div></div>
<div id="select" class="pointer"><div class="topline"><h1>NEON <em>DOMINION</em></h1><small>54 LUTADORES • ARENA 01</small></div><div id="grid"></div><div id="selectionFooter"><div class="fighterInfo"><h2 id="selname">RYO</h2><p id="seldesc">AGILIDADE EXTREMA</p><div class="tags" id="tags"></div></div><button class="begin" id="begin">INICIAR DUEL0</button></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const surnames=['RYO','NOVA','KAISER','VIPER','JIN','AKIRA','BRUMA','ZARA','TITAN','NEON','ONYX','KIRA','RAZE','SOLO','EMBER','LYNX','KNOX','SAGE','VOLT','ECHO','MORO','JUNO','FROST','HEX','DANTE','MIRA','ZERO','ORION','LUX','KODA','STORM','VEX','ARIA','DRAKE','BLAZE','NYX','RUNE','CYAN','ROOK','NIKO','CYRA','AXEL','WRAITH','FLUX','IRIS','TALON','GHOST','HADES','TERRA','SOL','QUINN','ATLAS','NOVA 2','EON'];
const styles=['ARTES MARCIAIS','NINJA ELÉTRICO','BOXE PESADO','CAPOEIRA','TAEKWONDO','SAMURAI','MAGIA GELADA','KICKBOXING','SUMÔ TECNO','CYBER-WRESTLE'];
const colors=['#ef476f','#00cfd1','#ff9f1c','#8338ec','#3a86ff','#06d6a0','#ff006e','#4cc9f0','#fb5607','#b9fbc0'];
const roster=surnames.map((n,i)=>({name:n,style:styles[i%styles.length],color:colors[i%colors.length],skin:['#f1c27d','#b96f4b','#6f4533','#e0ac69','#7a4d35'][i%5],hair:colors[(i*3+2)%colors.length]}));
let chosen=0,game=false,keys={},last=performance.now(),timeLeft=60,timerAcc=0;
const grid=document.getElementById('grid');roster.forEach((p,i)=>{let b=document.createElement('button');b.className='portrait'+(i===0?' selected':'');b.style='--c:'+p.color+';--skin:'+p.skin+';--hair:'+p.hair;b.innerHTML='<i></i>';b.title=p.name;b.onclick=()=>select(i);grid.appendChild(b)});
function select(i){chosen=i;document.querySelectorAll('.portrait').forEach((e,j)=>e.classList.toggle('selected',j===i));let p=roster[i];document.getElementById('selname').textContent=p.name;document.getElementById('seldesc').textContent=p.style+' • PODER '+(70+i%30);document.getElementById('tags').innerHTML='<span>'+p.style+'</span><span>'+(['VELOCIDADE','FORÇA','TÉCNICA','DEFESA'][i%4])+'</span>'}
select(0);
function Fighter(x,p,dir){return{x,y:0,hp:100,vx:0,vy:0,dir,p,att:0,hit:0,flash:0,block:false}}let p1,p2;
function start(){let cpu=(chosen+17)%roster.length;p1=Fighter(W*.28,roster[chosen],1);p2=Fighter(W*.72,roster[cpu],-1);document.getElementById('p1name').textContent=p1.p.name;document.getElementById('p1style').textContent=p1.p.style;document.getElementById('p2name').textContent=p2.p.name;document.getElementById('p2style').textContent=p2.p.style;document.getElementById('select').style.display='none';game=true;timeLeft=60;timerAcc=0;let r=document.getElementById('round');r.textContent='ROUND 1';r.style.opacity=1;setTimeout(()=>r.style.opacity=0,1100)}document.getElementById('begin').onclick=start;
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{let code=b.dataset.key;b.addEventListener('pointerdown',e=>{e.prevent;keys[code]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys[code]=false);b.addEventListener('pointercancel',()=>keys[code]=false)});
function hit(a,b,power){let d=Math.abs(a.x-b.x);if(d<155&&b.hit<=0){b.hp=Math.max(0,b.hp-power);b.hit=.25;b.vx=a.dir*(power*3);b.flash=.12;if(b.hp<=0)roundOver(a.p.name)}}
function roundOver(winner){game=false;let r=document.getElementById('round');r.textContent=winner+' VENCEU';r.style.opacity=1;setTimeout(()=>{r.style.opacity=0;document.getElementById('select').style.display='flex'},2200)}
function update(dt){if(!game)return;timerAcc+=dt;if(timerAcc>1){timerAcc-=1;timeLeft--;document.getElementById('timer').textContent=timeLeft;if(timeLeft<=0){game=false;let r=document.getElementById('round');r.textContent=(p1.hp>=p2.hp?p1.p.name:p2.p.name)+' VENCEU';r.style.opacity=1;setTimeout(()=>{r.style.opacity=0;document.getElementById('select').style.display='flex'},2200)}}
 let move=(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0);p1.vx+=move*1400*dt;p1.block=keys.ArrowDown;if(keys.ArrowUp&&p1.y===0)p1.vy=-620; if(keys.KeyJ&&p1.att<=0){p1.att=.38;hit(p1,p2,7)} if(keys.KeyK&&p1.att<=0){p1.att=.55;hit(p1,p2,11)}
 // CPU
 let dist=p2.x-p1.x;if(Math.abs(dist)>130)p2.vx+=(dist>0?1:-1)*700*dt;else if(Math.random()<.025)p2.att=.45,hit(p2,p1,8);if(Math.abs(dist)<100&&Math.random()<.01)p2.block=true;else p2.block=false;
 [p1,p2].forEach(f=>{f.vx*=Math.pow(.08,dt);f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.y<0)f.vy+=1500*dt;else{f.y=0;f.vy=0}f.att=Math.max(0,f.att-dt);f.hit=Math.max(0,f.hit-dt);f.flash=Math.max(0,f.flash-dt);f.x=Math.max(W*.12,Math.min(W*.88,f.x));f.dir=f===p1?(p2.x>p1.x?1:-1):(p1.x>p2.x?1:-1)});document.getElementById('p1hp').style.width=p1.hp+'%';document.getElementById('p2hp').style.width=p2.hp+'%'}
function drawArena(){let horizon=H*.43;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#080d21');sky.addColorStop(1,'#24134a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let i=0;i<12;i++){let x=(i*W/11+((performance.now()/120)%W/11))%W;ctx.fillStyle=i%2?'#17203f':'#10162d';ctx.fillRect(x,horizon-170-(i%3)*25,Math.max(35,W*.045),170+(i%3)*25);ctx.fillStyle='#ff497a55';for(let y=horizon-150-(i%3)*25;y<horizon-30;y+=24)ctx.fillRect(x+8,y,3,10)}ctx.fillStyle='#111521';ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();for(let i=-12;i<13;i++){ctx.strokeStyle='rgba(89,105,168,.25)';ctx.beginPath();ctx.moveTo(W/2,horizon);ctx.lineTo(W/2+i*W*.13,H);ctx.stroke()}for(let y=0;y<11;y++){let t=y/10,yy=horizon+(H-horizon)*t*t;ctx.strokeStyle='rgba(89,105,168,.22)';ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}ctx.fillStyle='#743cff';ctx.fillRect(0,horizon-5,W,3);ctx.fillStyle='#ff416c';ctx.fillRect(W*.12,horizon-8,W*.76,2)}
function fighter(f){let ground=H*.73-f.y*(.15);let scale=.78+ground/H*.55,dir=f.dir;ctx.save();ctx.translate(f.x,ground);ctx.scale(dir*scale,scale);ctx.globalAlpha=f.flash?.65:1;ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(0,8,55,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.fillRect(-28,0,23,105);ctx.fillRect(7,0,23,105);ctx.fillStyle=f.p.color;ctx.beginPath();ctx.moveTo(-38,105);ctx.lineTo(-12,105);ctx.lineTo(-14,130);ctx.lineTo(-48,130);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(12,105);ctx.lineTo(38,105);ctx.lineTo(48,130);ctx.lineTo(14,130);ctx.closePath();ctx.fill();ctx.fillStyle=f.p.color;ctx.beginPath();ctx.moveTo(-30,-20);ctx.quadraticCurveTo(0,-45,30,-20);ctx.lineTo(38,82);ctx.quadraticCurveTo(0,105,-38,82);ctx.closePath();ctx.fill();ctx.fillStyle='#151a29';ctx.fillRect(-12,-5,24,76);let swing=f.att>0?-55+(f.att/.55)*45:0;ctx.fillStyle=f.p.skin;ctx.save();ctx.translate(-30,5);ctx.rotate(-.65+swing*.018);ctx.fillRect(-10,-5,18,78);ctx.restore();ctx.save();ctx.translate(30,5);ctx.rotate(.65-swing*.018);ctx.fillRect(-8,-5,18,78);ctx.restore();ctx.fillStyle=f.p.skin;ctx.beginPath();ctx.arc(0,-48,31,0,Math.PI*2);ctx.fill();ctx.fillStyle=f.p.hair;ctx.beginPath();ctx.arc(-2,-57,32,Math.PI,Math.PI*2);ctx.lineTo(29,-43);ctx.lineTo(-25,-43);ctx.fill();ctx.fillStyle='#10131d';ctx.fillRect(-14,-50,9,4);ctx.fillRect(8,-50,9,4);ctx.fillStyle='#fff';ctx.fillRect(-11,-49,3,2);ctx.fillRect(11,-49,3,2);if(f.att>0){ctx.fillStyle='#fff';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(dir>0?70:-70,35,18,0,Math.PI*2);ctx.fill()}ctx.restore();}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);drawArena();if(p1&&p2){fighter(p1);fighter(p2)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RUN — 10 Fases</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070812;font-family:Arial,Helvetica,sans-serif;color:#fff;user-select:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;font-style:italic;font-size:19px;text-shadow:0 2px 12px #7c4dff}.brand b{color:#ff32b5}.statrow{display:flex;gap:10px}.stat{min-width:92px;text-align:center;background:rgba(8,10,28,.72);border:1px solid rgba(139,106,255,.35);border-radius:12px;padding:8px 12px;backdrop-filter:blur(8px)}.stat small{display:block;color:#aaaad2;font-size:9px;font-weight:bold;letter-spacing:1.5px}.stat strong{font-size:18px}.distance{position:absolute;top:84px;left:50%;transform:translateX(-50%);font-weight:900;font-size:14px;color:#bdfcff;text-shadow:0 0 12px #00eaff}.phasebar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(420px,56vw);height:6px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}.phasebar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#6cf,#e65cff);box-shadow:0 0 15px #9ff}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 55%,rgba(20,16,61,.2),rgba(3,4,18,.82));pointer-events:auto}.panel{width:min(760px,92vw);text-align:center}.logo{margin:0;font-size:clamp(54px,9vw,108px);line-height:.86;font-weight:1000;font-style:italic;letter-spacing:-7px;text-shadow:5px 6px 0 #5522a8,-5px -4px 24px #ff38a8}.logo span{display:block;color:#62efff;font-size:.48em;letter-spacing:16px;margin-top:16px;text-shadow:0 0 18px #22cfff}.panel h2{font-size:15px;color:#bcbce8;letter-spacing:5px;margin:24px 0}.button{border:0;border-radius:14px;padding:15px 35px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#19cfe8,#7768ff);color:white;font-size:15px;box-shadow:0 12px 35px rgba(97,75,255,.38);cursor:pointer}.button:hover{filter:brightness(1.12);transform:translateY(-2px)}.levels{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:22px auto}.level{width:58px;height:58px;border:1px solid rgba(160,145,255,.32);border-radius:12px;background:rgba(15,18,48,.78);display:grid;place-items:center;font-weight:900;position:relative;color:#77799c}.level.unlocked{color:white;border-color:#7b72ff;background:linear-gradient(145deg,rgba(88,78,190,.8),rgba(25,29,74,.9));box-shadow:0 6px 18px rgba(74,68,220,.22)}.level.done{color:#85f5ff}.level.active{outline:2px solid #ff52bd}.level small{position:absolute;bottom:5px;font-size:8px;color:#aaa}.controls{display:flex;justify-content:space-between;position:absolute;inset:auto 18px 36px;pointer-events:none}.ctrlsides{display:flex;gap:12px}.touch{pointer-events:auto;width:64px;height:64px;border:1px solid rgba(180,205,255,.25);border-radius:50%;background:rgba(12,18,45,.5);display:grid;place-items:center;font-size:23px;backdrop-filter:blur(5px)}.hidden{display:none!important}.pausebtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid rgba(160,180,255,.25);background:rgba(12,18,45,.55);font-size:18px;color:white}.gameover h1{font-size:50px;margin:10px;color:#ff64c7}.gameover p{color:#bbbce0}.resultstats{display:flex;justify-content:center;gap:12px;margin:20px}.toast{position:absolute;top:135px;left:50%;transform:translateX(-50%);font-weight:1000;letter-spacing:4px;font-size:20px;color:#fff;text-shadow:0 0 18px #b9f}.shield{position:absolute;top:88px;right:24px;color:#75eaff;font-size:12px;display:none}.shield.on{display:block}@media(max-width:700px){.topbar{top:10px;left:10px;right:10px}.brand{font-size:14px}.statrow{gap:4px}.stat{min-width:68px;padding:6px}.stat strong{font-size:14px}.distance{top:62px}.shield{top:65px}.logo{letter-spacing:-4px}.panel h2{letter-spacing:3px}.level{width:48px;height:48px}.controls{bottom:20px}.phasebar{bottom:10px}.touch{width:58px;height:58px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="hud">
  <div class="topbar"><div class="brand">NEON <b>RUN</b></div><div class="statrow"><div class="stat"><small>MOEDAS</small><strong id="coins">0</strong></div><div class="stat"><small>PONTOS</small><strong id="score">0000</strong></div></div></div>
  <div class="distance" id="distance">FASE 1 • 0 / 800m</div><div class="shield" id="shield">🛡 ESCUDO ON</div><div class="phasebar"><i id="progress"></i></div>
  <div class="controls"><div class="ctrlsides"><button class="touch" id="left">◀</button><button class="touch" id="right">▶</button></div><button class="pausebtn" id="pause">Ⅱ</button></div>
  <div class="toast hidden" id="toast"></div>
</div>
<div class="overlay" id="menu">
 <div class="panel"><h1 class="logo">NEON<span>SKY RUNNER</span></h1><h2>ESCOLHA SUA FASE</h2><div class="levels" id="levels"></div><button class="button" id="start">INICIAR CORRIDA</button></div>
</div>
<div class="overlay hidden" id="gameover"><div class="panel gameover"><h1 id="resultTitle">COLISÃO!</h1><p id="resultText">Sua nave foi atingida</p><div class="resultstats"><div class="stat"><small>DISTÂNCIA</small><strong id="finalDist">0m</strong></div><div class="stat"><small>MOEDAS</small><strong id="finalCoins">0</strong></div></div><button class="button" id="retry">TENTAR NOVAMENTE</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const names=['VÉRTICE','ULTRAVIA','NEBULOSA','TOXICO','CROMA','MAGMA','ABISMO','PÓLAR','ÓRBITA','INFINITO'];
let unlocked=+(localStorage.neonUnlocked||1), phase=1, completed=JSON.parse(localStorage.neonDone||'[]');
const menu=document.getElementById('menu'),over=document.getElementById('gameover'),hud=document.getElementById('hud');
function buildLevels(){let el=document.getElementById('levels');el.innerHTML='';for(let i=1;i<=10;i++){let b=document.createElement('div');b.className='level '+(i<=unlocked?'unlocked ':'')+(completed.includes(i)?'done ':'')+(i===phase?'active ':'');b.innerHTML=i+(completed.includes(i)?'<small>✓</small>':i>unlocked?'<small>🔒</small>':'');if(i<=unlocked)b.onclick=()=>{phase=i;buildLevels()};el.appendChild(b)}}buildLevels();
let running=false,paused=false,last=0,time=0,speed=0,roadOffset=0,playerLane=1,playerX=0,targetLane=1,coins=0,score=0,distance=0,shield=0,objects=[],particles=[];const goal=800;
function reset(){running=true;paused=false;time=0;speed=310+phase*18;roadOffset=0;playerLane=1;targetLane=1;playerX=0;coins=0;score=0;distance=0;shield=0;objects=[];particles=[];menu.classList.add('hidden');over.classList.add('hidden');hud.classList.remove('hidden');document.getElementById('shield').classList.remove('on');spawnInitial()}
function spawnInitial(){for(let z=900;z<5000;z+=650+Math.random()*260)spawnObject(z)}
function spawnObject(z){let r=Math.random(),lane=Math.floor(Math.random()*3);if(r<.18){objects.push({type:'coin',lane,z: z+(Math.random()*120),spin:Math.random()*6})}else if(r<.76){objects.push({type:Math.random()<.7?'barrier':'drone',lane,z,spin:0})}else{objects.push({type:'shield',lane,z,spin:0})};if(r>.65&&Math.random()<.45){objects.push({type:Math.random()<.5?'barrier':'drone',lane:(lane+1)%3,z:z+300,spin:0})}}
function laneX(lane,z){let horizon=W*.5,base=W*.5,depth=Math.max(0,1-z/4600);let spread=W*(.055+depth*.31);return horizon+(lane-1)*spread}
function project(z,y=0){let horizon=H*.34,scale=Math.max(.01,1-z/4600);let roadBottom=H*.86;let py=horizon+(roadBottom-horizon)*scale+y*scale;let cx=W*.5;return {x:cx+(cx-W*.5)*.0,y:py,scale}}
function moveLane(d){if(!running||paused)return;targetLane=Math.max(0,Math.min(2,targetLane+d))}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')moveLane(-1);if(e.key==='ArrowRight'||e.key==='d')moveLane(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')e.preventDefault();if(e.key==='Escape')togglePause()});
document.getElementById('left').ontouchstart=e=>{e.preventDefault();moveLane(-1)};document.getElementById('right').ontouchstart=e=>{e.preventDefault();moveLane(1)};
let sx=0;canvas.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>35)moveLane(dx>0?1:-1)},{passive:true});
document.getElementById('start').onclick=reset;document.getElementById('retry').onclick=reset;document.getElementById('pause').onclick=togglePause;
function togglePause(){if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(el.tt)}; eltt=()=>{};
function burst(x,y,c,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.9)*220,life:.5+Math.random()*0.5,c})}
function endGame(win){running=false;over.classList.remove('hidden');document.getElementById('resultTitle').textContent=win?'FASE CONCLUÍDA!':'COLISÃO!';document.getElementById('resultText').textContent=win?names[phase-1]+': velocidade dominada':'Sua nave foi atingida';document.getElementById('finalDist').textContent=Math.floor(distance)+'m';document.getElementById('finalCoins').textContent=coins;if(win){if(!completed.includes(phase))completed.push(phase);if(phase===unlocked&&unlocked<10)unlocked++;localStorage.neonDone=JSON.stringify(completed);localStorage.neonUnlocked=unlocked;buildLevels()} }
function update(dt){if(paused)return;time+=dt;speed=310+phase*18+distance*.14;distance+=speed*dt/100;score+=dt*(80+phase*4);roadOffset=(roadOffset+speed*dt)%70;playerLane+=(targetLane-playerLane)*Math.min(1,dt*10);let maxZ=0;for(let o of objects){o.z-=speed*dt;o.spin+=dt*5;if(o.z<20){if(o.type==='coin'||o.type==='shield'){} }if(o.z>-40&&o.z<75&&Math.abs(o.lane-playerLane)<.38){if(o.type==='coin'){coins++;score+=100;o.z=-1000;burst(laneX(o.lane,55),H*.74,'#ffe43c',8)}else if(o.type==='shield'){shield=7;o.z=-1000;document.getElementById('shield').classList.add('on');burst(laneX(o.lane,55),H*.74,'#55efff',10)}else if(shield>0){o.z=-1000;shield=0;document.getElementById('shield').classList.remove('on');burst(laneX(o.lane,55),H*.74,'#ff72c9',20)}else endGame(false)}}objects=objects.filter(o=>o.z>-300);if(objects.length<12||objects.every(o=>o.z<3800))spawnObject(4100+Math.random()*700);if(shield>0){shield-=dt;if(shield<=0)document.getElementById('shield').classList.remove('on')}document.getElementById('coins').textContent=coins;document.getElementById('score').textContent=Math.floor(score).toString().padStart(4,'0');document.getElementById('distance').textContent='FASE '+phase+' • '+Math.floor(distance)+' / '+goal+'m';document.getElementById('progress').style.width=Math.min(100,distance/goal*100)+'%';if(distance>=goal)endGame(true);}
function path(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]))}
function road(){let horizon=H*.34,bottom=H*.88,cx=W*.5;let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#08091f');bg.addColorStop(.38,'#17113a');bg.addColorStop(.7,'#090d25');bg.addColorStop(1,'#050714');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<50;i++){let yy=horizon-i*i*.15;ctx.fillStyle=i%2?'rgba(255,74,180,.12)':'rgba(56,213,255,.08)';ctx.fillRect((i*193)%W,((i*67+time*8)%H),2,2)}ctx.strokeStyle='rgba(91,226,255,.12)';ctx.lineWidth=1;for(let i=0;i<12;i++){let z=i*500-roadOffset*7;let p1=project(z);let p2=project(z+260);ctx.beginPath();ctx.moveTo(cx-W*(.38*(1-p1.scale)+.02),p1.y);ctx.lineTo(cx-W*(.38*(1-p2.scale)+.02),p2.y);ctx.stroke()}let grad=ctx.createLinearGradient(0,horizon,0,bottom);grad.addColorStop(0,'#22254c');grad.addColorStop(.6,'#171933');grad.addColorStop(1,'#090b21');ctx.fillStyle=grad;path([[cx-W*.06,horizon],[cx+W*.06,horizon],[cx+W*.42,bottom],[cx-W*.42,bottom]]);ctx.fill();for(let l=1;l<3;l++){ctx.beginPath();ctx.moveTo(cx+(l-1.5)*W*.04,horizon);ctx.lineTo(cx+(l-1.5)*W*.28,bottom);ctx.strokeStyle='rgba(125,156,255,.32)';ctx.lineWidth=3;ctx.stroke()}for(let z=-roadOffset;z<4600;z+=260){let a=project(z),b=project(z+7);ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(cx-W*.42*b.scale, b.y,W*.84*b.scale,Math.max(1,b.y-a.y))}}
function drawObject(o){if(o.z<-20||o.z>4600)return;let lanePx=W*.5+(o.lane-1)*W*(.055+.31*Math.max(.01,1-o.z/4600));let horizon=H*.34,bottom=H*.86,sc=Math.max(.03,1-o.z/4600);let y=horizon+(bottom-horizon)*sc;let s=Math.max(4,sc*92);if(o.type==='coin'){ctx.save();ctx.translate(lanePx,y-s*.35);ctx.scale(.45+Math.abs(Math.cos(o.spin))*1.1,1);ctx.fillStyle='#ffd45a';ctx.beginPath();ctx.arc(0,0,s*.34,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff39a';ctx.lineWidth=3;ctx.stroke();ctx.restore()}else if(o.type==='shield'){ctx.save();ctx.translate(lanePx,y-s*.4);ctx.scale(1,1);ctx.fillStyle='rgba(67,226,255,.28)';ctx.beginPath();ctx.arc(0,0,s*.45,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#79efff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-s*.42);ctx.lineTo(s*.32,-s*.18);ctx.lineTo(s*.25,s*.28);ctx.lineTo(0,s*.48);ctx.lineTo(-s*.25,s*.28);ctx.lineTo(-s*.32,-s*.18);ctx.closePath();ctx.stroke();ctx.restore()}else{let red=o.type==='drone';ctx.save();ctx.translate(lanePx,y);ctx.shadowColor=red?'#ff2b78':'#7a56ff';ctx.shadowBlur=18*s/70;ctx.fillStyle=red?'#be204f':'#3a315f';ctx.strokeStyle=red?'#ff68a1':'#9b83ff';ctx.lineWidth=Math.max(2,s*.045);ctx.beginPath();ctx.moveTo(-s*.42,0);ctx.lineTo(-s*.36,-s*.55);ctx.lineTo(s*.36,-s*.55);ctx.lineTo(s*.42,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=red?'#ff83b3':'#65d7ff';ctx.fillRect(-s*.25,-s*.44,s*.5,s*.09);ctx.restore()}}
function ship(){let cx=W*.5+(playerLane-1)*W*(.055+.31*.55),y=H*.79,s=Math.min(W,H)*(.09+.05);ctx.save();ctx.translate(cx,y);ctx.scale(1,1);let glow=ctx.createRadialGradient(0,s*.15,0,0,s*.15,s*.9);glow.addColorStop(0,'rgba(91,244,255,.8)');glow.addColorStop(1,'rgba(91,244,255,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,s*.2,s*.9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b5bdff';ctx.strokeStyle='#4af2ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-s*.62);ctx.lineTo(s*.38,-s*.05);ctx.lineTo(s*.62,s*.35);ctx.lineTo(s*.22,s*.22);ctx.lineTo(0,s*.48);ctx.lineTo(-s*.22,s*.22);ctx.lineTo(-s*.62,s*.35);ctx.lineTo(-s*.38,-s*.05);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#201d55';ctx.beginPath();ctx.moveTo(-s*.16,-s*.22);ctx.lineTo(0,-s*.48);ctx.lineTo(s*.16,-s*.22);ctx.lineTo(s*.1,s*.12);ctx.lineTo(-s*.1,s*.12);ctx.closePath();ctx.fill();ctx.fillStyle='#ff62cb';ctx.fillRect(-s*.07,s*.35,s*.14,s*.35+Math.random()*8);if(shield>0){ctx.strokeStyle='rgba(105,236,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,s*.78,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function draw(){road();objects.sort((a,b)=>b.z-a.z).forEach(drawObject);ship();for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=1/60;p.x+=p.vx/60;p.y+=p.vy/60;p.vy+=500/60;ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(running&&!paused){update(dt)}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
